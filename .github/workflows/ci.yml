name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  frontend-platform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install workspace dependencies
        run: npm ci
      - name: Typecheck workspace
        run: npm run typecheck
      - name: Test workspace
        run: npm test
      - name: Build web applications
        run: npm run build
      - name: Upload production web bundle
        uses: actions/upload-artifact@v4
        with:
          name: cabinsentinel-web
          path: dist
          if-no-files-found: error
          retention-days: 1

  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint with ruff
        run: ruff check services/api/src/ src/ tests/

      - name: Run tests
        run: pytest tests/ -v --tb=short
        env:
          APP_ENV: test
          OPENAI_API_KEY: test-key

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build deployable image
        run: docker build -t cabinsentinel-v1:ci .
      - name: Verify BaoTam inference and packaged model assets
        run: |
          docker run --rm -e APP_ENV=test -e OPENAI_API_KEY=test-key \
            -e PYTHONDONTWRITEBYTECODE=1 \
            -v "$PWD/tests:/app/tests:ro" \
            -v "$PWD/scripts:/app/scripts:ro" \
            -v "$PWD/vision-models.json:/app/vision-models.json:ro" \
            cabinsentinel-v1:ci python -m pytest -q -p no:cacheprovider \
              tests/test_vision_age.py tests/test_vision_age_adapter.py \
              tests/test_vision_motion.py tests/test_vision_overlay.py \
              tests/test_vision_video.py tests/test_vision_evaluation.py \
              tests/test_vision_model_assets.py tests/test_vision_privacy.py
      - name: Smoke test deployable container
        run: |
          set -eu
          cleanup() {
            result=$?
            if [ "$result" -ne 0 ]; then docker logs cabinsentinel-smoke; fi
            docker rm -f cabinsentinel-smoke >/dev/null
          }
          trap cleanup EXIT
          docker run -d --name cabinsentinel-smoke \
            -p 127.0.0.1:18080:8080 -e PORT=8080 -e APP_ENV=production \
            -e CORS_ORIGINS=https://cabinsentinel-example.vercel.app \
            -e CABINSENTINEL_MQTT_ENABLED=false cabinsentinel-v1:ci
          python - <<'PY'
          import json
          import time
          import urllib.error
          import urllib.request

          for attempt in range(60):
              try:
                  try:
                      response = urllib.request.urlopen('http://127.0.0.1:18080/health', timeout=2)
                  except urllib.error.HTTPError as error:
                      response = error
                  with response:
                      status = response.code
                      health = json.load(response)
                  break
              except (OSError, ValueError, urllib.error.URLError):
                  if attempt == 59:
                      raise
                  time.sleep(1)
          assert status == 503, (status, health)
          assert health['backend'] == 'ready' and health['database'] == 'ready', health
          assert health['vision'] == 'unavailable' and health['status'] == 'degraded', health
          print('Container boots without weights and truthfully reports demo unavailable')
          PY
          test "$(docker exec cabinsentinel-smoke id -u)" -ne 0
          docker exec -i cabinsentinel-smoke python - <<'PY'
          import importlib.metadata as metadata
          import torch
          from ultralytics.utils import AUTOINSTALL

          assert torch.version.cuda is None, torch.__version__
          assert AUTOINSTALL is False, 'Runtime package installation must be disabled'
          names = {d.metadata["Name"].lower().replace("_", "-") for d in metadata.distributions()}
          # Ultralytics requires the small NVML helper on Linux, including CPU installs.
          gpu = {n for n in names if (n.startswith("nvidia-") and n != "nvidia-ml-py") or n == "triton"}
          assert not gpu, gpu
          print('CPU-only PyTorch', torch.__version__)
          PY
          docker exec cabinsentinel-smoke python -m src.healthcheck

  deploy-cloudflare:
    name: Deploy Cloudflare Worker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [frontend-platform, lint-and-test, docker-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    environment:
      name: production
      url: https://cabinsentinel.thuhientranthi-ai.workers.dev
    concurrency:
      group: cabinsentinel-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Download production web bundle
        uses: actions/download-artifact@v4
        with:
          name: cabinsentinel-web
          path: dist
      - name: Report missing deployment secrets
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == ''
        run: echo "::warning::Cloudflare deployment skipped until CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are configured."
      - name: Deploy CabinSentinel
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.147.0"
          command: deploy
