services:
  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "127.0.0.1:1883:1883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      MQTT_BROKER_HOST: mosquitto
      CABINSENTINEL_MQTT_ENABLED: ${CABINSENTINEL_MQTT_ENABLED:-false}
    depends_on:
      - mosquitto
    volumes:
      - cabinsentinel_data:/app/data
      - ${MODEL_DIR:-./models}:/app/models:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  cabinsentinel_data:
