# docker compose up -d --build   (reads backend/.env)
services:
  api:
    build: ./backend
    env_file: ./backend/.env
    volumes: ["cabin-data:/data"]
    restart: unless-stopped
    read_only: true                       # the image is immutable; only /data and /tmp are writable
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID]      # only for the entrypoint to fix volume ownership and drop root
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    pids_limit: 256
  caddy:            # automatic HTTPS: set CABIN_DOMAIN=cabin.example.com and point DNS at this machine
    image: caddy:2
    ports: ["80:80", "443:443"]
    environment: { CABIN_DOMAIN: "${CABIN_DOMAIN:-localhost}" }
    command: caddy reverse-proxy --from ${CABIN_DOMAIN:-localhost} --to api:8000
    depends_on: [api]
    restart: unless-stopped
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
volumes:
  cabin-data:
