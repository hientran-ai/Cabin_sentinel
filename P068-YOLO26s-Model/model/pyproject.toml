[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "p068-vision"
version = "0.1.0"
description = "YOLO26s, face age, tracking, motion and privacy integration library"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "ultralytics==8.4.159",
  "torch==2.14.0",
  "torchvision==0.29.0",
  "opencv-python==5.0.0.93",
  "numpy==2.4.6",
  "Pillow==12.3.0",
  "psutil==7.2.2",
  "imageio-ffmpeg==0.6.0",
]

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[tool.setuptools]
license-files = ["licenses/*"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
p068_vision = ["assets.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
