<!doctype html><html lang="vi"><meta charset="utf-8"><title>Gán nhãn người trong cabin</title>
<style>body{font:16px system-ui;background:#f4f6f8;color:#17212f;margin:24px}button{padding:10px;margin:4px;cursor:pointer}canvas{display:block;max-width:100%;height:auto;background:#222;touch-action:none}#status{margin:12px 0}p{max-width:1000px}</style>
<h1>Khoanh tất cả người trong ảnh</h1>
<p>Kéo chuột để vẽ từng khung bao người ở phần cơ thể nhìn thấy. Bao gồm người bị che và trẻ nhỏ; không khoanh đồ vật. Xác nhận cả ảnh không có người. Nhãn gợi ý từ model không được dùng làm đáp án.</p>
<button id="prev">← Trước</button><button id="next">Sau →</button><button id="undo">Xóa khung cuối</button><button id="review">Xác nhận ảnh này</button><button id="save">Tải labels.json</button><button id="load">Nạp nhãn đã lưu</button><input id="file" type="file" accept=".json" hidden>
<div id="status"></div><canvas id="canvas"></canvas>
<script>
const payload=__PAYLOAD__, manifest=payload.manifest, canvas=document.getElementById('canvas'), ctx=canvas.getContext('2d');
let index=0, start=null, currentImage=null, generation=0;
const status=document.getElementById('status');
function draw(){ctx.clearRect(0,0,canvas.width,canvas.height);if(currentImage)ctx.drawImage(currentImage,0,0);ctx.strokeStyle='#00ff80';ctx.lineWidth=Math.max(2,canvas.width/400);manifest.frames[index].boxes.forEach(b=>ctx.strokeRect(b[0],b[1],b[2]-b[0],b[3]-b[1]));const f=manifest.frames[index];status.textContent=`Ảnh ${index+1}/${manifest.frames.length} · frame ${f.frame_id} · ${f.boxes.length} người · ${f.reviewed?'Đã xác nhận':'Chưa xác nhận'} · Tổng ${manifest.frames.filter(f=>f.reviewed).length} ảnh đã xác nhận`;}
function show(){start=null;currentImage=null;const g=++generation, img=new Image();canvas.width=manifest.frames[index].width;canvas.height=manifest.frames[index].height;draw();img.onload=()=>{if(g===generation){currentImage=img;draw();}};img.src=payload.images[index];}
function point(e){const r=canvas.getBoundingClientRect();return [Math.max(0,Math.min(canvas.width,(e.clientX-r.left)*canvas.width/r.width)),Math.max(0,Math.min(canvas.height,(e.clientY-r.top)*canvas.height/r.height))];}
canvas.onpointerdown=e=>{if(!currentImage)return;start=point(e);canvas.setPointerCapture(e.pointerId);};
canvas.onpointermove=e=>{if(!start)return;draw();const p=point(e);ctx.strokeRect(start[0],start[1],p[0]-start[0],p[1]-start[1]);};
canvas.onpointerup=e=>{if(!start)return;const p=point(e), b=[Math.min(start[0],p[0]),Math.min(start[1],p[1]),Math.max(start[0],p[0]),Math.max(start[1],p[1])].map(Math.round);if(b[2]-b[0]>3&&b[3]-b[1]>3){manifest.frames[index].boxes.push(b);manifest.frames[index].reviewed=false;}start=null;draw();};
canvas.onpointercancel=()=>{start=null;draw();};
document.getElementById('prev').onclick=()=>{index=Math.max(0,index-1);show();};document.getElementById('next').onclick=()=>{index=Math.min(manifest.frames.length-1,index+1);show();};
document.getElementById('undo').onclick=()=>{manifest.frames[index].boxes.pop();manifest.frames[index].reviewed=false;draw();};
document.getElementById('review').onclick=()=>{manifest.frames[index].reviewed=true;draw();};
document.getElementById('save').onclick=()=>{const url=URL.createObjectURL(new Blob([JSON.stringify(manifest,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='labels.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};
document.getElementById('load').onclick=()=>document.getElementById('file').click();
document.getElementById('file').onchange=async e=>{try{const m=JSON.parse(await e.target.files[0].text());if(m.source!==manifest.source||m.frames.length!==manifest.frames.length||m.frames.some((f,i)=>f.frame_id!==manifest.frames[i].frame_id||f.image!==manifest.frames[i].image||f.width!==manifest.frames[i].width||f.height!==manifest.frames[i].height||typeof f.reviewed!=='boolean'||!Array.isArray(f.boxes)||f.boxes.some(b=>!Array.isArray(b)||b.length!==4||!b.every(Number.isFinite)||!(0<=b[0]&&b[0]<b[2]&&b[2]<=f.width&&0<=b[1]&&b[1]<b[3]&&b[3]<=f.height))))throw Error('Nhãn không khớp bộ ảnh hoặc khung bao không hợp lệ');manifest.frames=m.frames;show();}catch(error){alert(error.message);}};
show();
</script></html>
